[project]
name = "habodek"
version = "0.1.0"
description = "Habodek: a GitLab merge-request reviewer (the brain) and its evaluation harness."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Pinned: the 1.x series downloads grammars at first use (no network on the VPN).
    "tree-sitter-language-pack==0.13.0",
    "jedi==0.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
habodek = "habodek.cli:app"
habodek-brain = "habodek.brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["habodek*", "eval*"]

[tool.setuptools.package-data]
"habodek.brain" = ["llm/*.yaml", "workflow/roles/*.md"]
"eval.scenarios" = ["s*/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The evaluation corpus contains deliberately flawed code. Linting it would
# flag the very defects the reviewer under test is supposed to find.
extend-exclude = ["eval/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The probe runs on the VPN machine's system python3, whatever its age: it keeps to
# old-style formatting on purpose.
"probe/gateway_probe.py" = ["UP031", "UP032"]

[tool.pytest.ini_options]
testpaths = ["tests"]
